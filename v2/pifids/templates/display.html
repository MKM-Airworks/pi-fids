<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi-FIDS V2</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/display.css">
<body data-view="display"><header><img id="airportLogo" hidden alt="空港ロゴ"><h1 id="title"></h1><span id="clock"></span></header><div id="displayControls"><button id="fullscreen">全画面表示</button><a id="settingsLink">表示設定</a><span id="fullscreenMessage" role="status"></span></div><p class="notice setup-only">PREVIEW — 開発用試験表示</p><main><div id="board"></div><footer id="displayFooter"><span id="footerAirport"></span><span id="pageIndicator"></span><span id="localDate"></span></footer><p id="status" class="setup-only" role="status"></p><details class="setup-only"><summary>この表示画面の設定</summary><label>空港ロゴURL（http/https） <input id="logoUrl" type="url"></label><label>既定言語 <select id="defaultLanguage"></select></label><label>言語切替間隔（秒） <input id="interval" type="number" min="3" max="60" value="8"></label><label>便一覧の種類 <select id="boardDirection"><option value="departure">出発</option><option value="arrival">到着</option></select></label><label>一覧の1ページの便数 <input id="rowsPerPage" type="number" min="4" max="16" value="8"></label><button id="saveSettings">設定を保存</button></details></main><script src="/static/board-policy.js"></script><script src="/static/app.js"></script></body></html>
