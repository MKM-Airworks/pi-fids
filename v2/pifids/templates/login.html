<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pi-FIDS V2 · Sign in</title>
  <link rel="stylesheet" href="/static/login.css">
  <script src="/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="heading">
      <div class="login-language"><label for="loginLanguage">Language / 言語</label><select id="loginLanguage"><option value="en">English</option><option value="ja">日本語</option></select></div>
      <header class="login-brand">
        <img src="/static/branding/mkm-airworks-horizontal.png" alt="MKM Airworks" width="1302" height="520">
        <p class="eyebrow" id="consoleLabel">Operations Console</p>
        <h1 id="heading">Pi-FIDS V2</h1>
        <p class="login-subtitle" id="subtitle">Sign in</p>
      </header>
      <p class="login-description" id="description">Sign in on the management PC.</p>
      <form id="loginForm" class="login-form">
        <label><span id="userLabel">Username</span><input name="username" autocomplete="username" required></label>
        <label><span id="passwordLabel">Password</span><input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
        <label id="confirmLabel" hidden><span id="confirmText">Confirm password</span><input name="confirmation" type="password" maxlength="1024" autocomplete="new-password" disabled></label>
        <button id="submit">Sign in</button>
      </form>
      <p id="setupHelp" hidden></p>
      <p id="message" class="operation-message" role="status"></p>
      <footer class="login-version">Pi-FIDS V2 · MKM Airworks</footer>
    </section>
  </main>
</body>
</html>
