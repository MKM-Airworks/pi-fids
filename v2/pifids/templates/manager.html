<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi-FIDS V2 管理</title><link rel="stylesheet" href="/static/style.css">
<body data-view="manager"><main><label>Language / 言語 <select id="managerLanguage"><option value="en">English</option><option value="ja">日本語</option></select></label><button id="logout" type="button" hidden>ログアウト</button><h1>Pi-FIDS V2 管理</h1><p class="notice">開発用・試験情報のみ。本番配信には使用しないでください。</p>
<label>空港 <select id="airport"><option>SHI</option><option>ROR</option></select></label> <a id="displayLink" href="/display?airport=SHI" target="_blank" rel="noopener">表示画面を開く</a>
<section id="upstreamPanel"><h2>MKM Flight Web</h2><p id="upstreamHelp">取得した便を確認して下書きへ取り込みます。公開までは表示を変更しません。</p><label>運航日 <input id="upstreamDate" type="date"></label><button id="upstreamCheck" type="button" disabled>Webの更新を確認</button> <button id="upstreamImport" type="button" disabled>Webの便を下書きへ取込み</button><p id="upstreamStatus" role="status"></p><div id="upstreamPreview"></div></section><h2>画像を登録</h2><form id="assetForm"><label>画像（PNG/JPEG・2MBまで） <input id="assetFile" type="file" accept="image/png,image/jpeg" required></label><button>画像を登録</button></form><h2>端末の表示切替</h2><form id="displayForm"><label>画面ID <input id="displayId" name="displayId" value="counter-01" required pattern="[A-Za-z0-9_-]{1,40}" maxlength="40"></label><button id="loadDisplaySettings" type="button">端末設定を読み込む</button><label>表示 <select name="mode"><option value="board">標準の便一覧に戻す</option><option value="counter">チェックインカウンター</option><option value="gate">搭乗口</option></select></label><label>航空会社名 <input name="airline" maxlength="100"></label><label>ロゴ <select id="logoAsset" name="logo"><option value="">なし</option></select></label><label>案内画像 <select id="imageAsset" name="image"><option value="">なし</option></select></label><label>出発便の表示終了（分） <input name="departureHideMinutes" type="number" min="0" max="10080" step="1" value="10" required></label><label>到着便の表示終了（分） <input name="arrivalHideMinutes" type="number" min="0" max="10080" step="1" value="120" required></label><button>この画面に適用</button> <a id="targetDisplay" href="/display?airport=SHI&amp;displayId=counter-01" target="_blank" rel="noopener">対象画面を開く</a><p>切替後は対象画面を開いて確認してください。</p></form>
<h2>試験便を追加</h2><form id="flightForm"><label>便名 <input name="flightNumber" required maxlength="100" placeholder="BC101"></label><label>出発／到着 <select name="direction"><option value="departure">出発</option><option value="arrival">到着</option></select></label><label>行先／出発地 <input name="destination" required maxlength="100" placeholder="Tokyo"></label><label>運航日 <input name="serviceDate" type="date" required></label><label>定刻 <input name="time" type="time" required></label>
<label>予定時刻 <input name="estimatedTime" type="time"></label><label>予定時刻の日付 <input name="estimatedDate" type="date"></label><label>実績時刻（ATD／ATA） <input name="actualTime" type="time"></label><label>実績時刻の日付 <input name="actualDate" type="date"></label><p>時刻の日付が未指定の場合は運航日を使います。日付をまたぐ場合は日付も指定してください。</p><label>ゲート <input name="gate" maxlength="20"></label><label>備考 <input name="remark" maxlength="100"></label><label>航空会社ロゴ <select id="flightLogo" name="airlineLogo"><option value="">なし</option></select></label><fieldset><legend>表示言語（選択順に切替・未選択なら端末設定）</legend><div id="languages"></div><p id="languageOrder"></p></fieldset><p id="editStatus" role="status"></p><button id="saveFlight">下書きに追加</button> <button id="cancelEdit" type="button" hidden>編集をキャンセル</button></form>
<p id="message" role="status"></p><h2>下書き</h2><div id="draft"></div><button id="publish">下書きを公開</button><h2>公開済み</h2><div id="published"></div></main><script src="/static/manager-i18n.js"></script><script src="/static/board-policy.js"></script><script src="/static/app.js"></script></body></html>
