<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi-FIDS V2 管理</title><link rel="stylesheet" href="/static/style.css">
<body data-view="manager"><main><label>Language / 言語 <select id="managerLanguage"><option value="en">English</option><option value="ja">日本語</option></select></label><h1>Pi-FIDS V2 管理</h1><p class="notice">開発用・試験情報のみ。本番配信には使用しないでください。</p>
<label>空港 <select id="airport"><option>SHI</option><option>ROR</option></select></label> <a id="displayLink" href="/display?airport=SHI" target="_blank" rel="noopener">表示画面を開く</a>
<h2>画像を登録</h2><form id="assetForm"><label>画像（PNG/JPEG・2MBまで） <input id="assetFile" type="file" accept="image/png,image/jpeg" required></label><button>画像を登録</button></form><h2>端末の表示切替</h2><form id="displayForm"><label>画面ID <input id="displayId" name="displayId" value="counter-01" required pattern="[A-Za-z0-9_-]{1,40}" maxlength="40"></label><label>表示 <select name="mode"><option value="board">標準の便一覧に戻す</option><option value="counter">チェックインカウンター</option><option value="gate">搭乗口</option></select></label><label>航空会社名 <input name="airline" maxlength="100"></label><label>ロゴ <select id="logoAsset" name="logo"><option value="">なし</option></select></label><label>案内画像 <select id="imageAsset" name="image"><option value="">なし</option></select></label><button>この画面に適用</button> <a id="targetDisplay" href="/display?airport=SHI&amp;displayId=counter-01" target="_blank" rel="noopener">対象画面を開く</a><p>切替後は対象画面を開いて確認してください。</p></form>
<h2>試験便を追加</h2><form id="flightForm"><label>便名 <input name="flightNumber" required maxlength="100" placeholder="BC101"></label><label>出発／到着 <select name="direction"><option value="departure">出発</option><option value="arrival">到着</option></select></label><label>行先／出発地 <input name="destination" required maxlength="100" placeholder="Tokyo"></label><label>定刻 <input name="time" type="time" required></label>
<label>予定時刻 <input name="estimatedTime" type="time"></label><label>ゲート <input name="gate" maxlength="20"></label><label>備考 <input name="remark" maxlength="100"></label><label>航空会社ロゴ <select id="flightLogo" name="airlineLogo"><option value="">なし</option></select></label><fieldset><legend>表示言語（選択順に切替・未選択なら端末設定）</legend><div id="languages"></div><p id="languageOrder"></p></fieldset><button>下書きに追加</button></form>
<p id="message" role="status"></p><h2>下書き</h2><div id="draft"></div><button id="publish">下書きを公開</button><h2>公開済み</h2><div id="published"></div></main><script src="/static/manager-i18n.js"></script><script src="/static/app.js"></script></body></html>
